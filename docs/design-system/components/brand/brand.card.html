<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{padding:18px 20px;background:var(--bg-page)}
.row{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.cap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.k{font-size:var(--text-overline);letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--text-subtle);font-weight:600}
.ink{background:var(--ink-surface);padding:14px 18px;border-radius:var(--radius-md)}
.clay{background:var(--clay-surface);padding:14px 18px;border-radius:var(--radius-md)}
.note{margin-top:16px;padding:11px 13px;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);font-size:var(--text-body-sm);color:var(--text-muted);line-height:1.6;max-width:80ch}

<script type="text/babel">
const { Logo } = window.StairsLifeDesignSystem_075594;
function Demo(){return (
<div>
  <div className="row">
    <span className="cap"><Logo size={34} basePath="../../assets"/><i className="k">34px · header landing</i></span>
    <span className="cap"><Logo size={22} basePath="../../assets"/><i className="k">22px · sidebar</i></span>
    <span className="cap"><Logo size={18} wordmark={false} wood="flat" basePath="../../assets"/><i className="k">18px · mark datar</i></span>
  </div>
  <div className="row" style={{marginTop:22}}>
    <span className="cap"><span className="ink"><Logo size={26} color="var(--ink-text)" basePath="../../assets"/></span><i className="k">Permukaan tinta</i></span>

  </div>

</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
